name: Reusable - SAM Validate

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the SAM template.yaml.
        required: true
        type: string
      sam-version:
        description: SAM CLI version to install.
        required: false
        default: '1.160.0'
        type: string
      sam-validate-args:
        description: Extra args for `sam validate` (e.g. --lint).
        required: false
        default: ''
        type: string
      run-sam-build:
        description: Whether to run `sam build` after validation.
        required: false
        default: true
        type: boolean
      sam-build-args:
        description: Extra args for `sam build` (e.g. --parallel, --cached).
        required: false
        default: ''
        type: string
      node-utils-directory:
        description: Optional Node package directory to lint/format (empty to skip).
        required: false
        default: ''
        type: string
      node-version-file:
        description: Path (relative to repo root) to the .nvmrc for the utils package.
        required: false
        default: ''
        type: string
      lint-script:
        description: npm script for linting the utils package (empty to skip).
        required: false
        default: ''
        type: string
      format-check-script:
        description: npm script for format-checking the utils package (empty to skip).
        required: false
        default: ''
        type: string
      run-checkov:
        description: Whether to run Checkov against the template.
        required: false
        default: true
        type: boolean
      checkov-file:
        description: Path (relative to repo root) to the template Checkov should scan.
        required: false
        default: ''
        type: string

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ inputs.node-utils-directory != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Install utils dependencies
        if: ${{ inputs.node-utils-directory != '' }}
        working-directory: ${{ inputs.node-utils-directory }}
        run: npm ci

      - name: Check code formatting
        if: ${{ inputs.node-utils-directory != '' && inputs.format-check-script != '' }}
        working-directory: ${{ inputs.node-utils-directory }}
        run: npm run ${{ inputs.format-check-script }}

      - name: Run the linter
        if: ${{ inputs.node-utils-directory != '' && inputs.lint-script != '' }}
        working-directory: ${{ inputs.node-utils-directory }}
        run: npm run ${{ inputs.lint-script }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: ${{ inputs.sam-version }}
          use-installer: true

      - name: Validate SAM template
        run: |
          echo "SAM_CLI_TELEMETRY=0" >> $GITHUB_ENV
          sam validate ${{ inputs.sam-validate-args }}

      - name: Build SAM template
        if: ${{ inputs.run-sam-build }}
        run: sam build ${{ inputs.sam-build-args }}

      - name: Run Checkov
        if: ${{ inputs.run-checkov }}
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          file: ${{ inputs.checkov-file }}
          quiet: true
          soft_fail: false
