name: Document Builder - Pull Request Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - document-builder/**
      - .github/workflows/document-builder-pull-request-checks.yml

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Run tests, lint and validate
    uses: ./.github/workflows/_module-node-ci.yml
    with:
      working-directory: ./document-builder
      node-version-file: document-builder/.nvmrc
      install-command: npm ci --ignore-scripts
      run-build: true
      lint-command: npm run lint
      run-sam-validate: true
      sam-validate-working-directory: deploy
      sam-validate-args: --region eu-west-2

  sonarqube:
    name: SonarQube analysis
    uses: ./.github/workflows/_module-sonarqube.yml
    with:
      project-base-dir: ./document-builder
      scan-metadata-report-file: document-builder/.scannerwork/report-task.txt
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  checkov:
    name: Run Checkov
    uses: ./.github/workflows/_module-checkov.yml
    with:
      template-file: "document-builder/deploy/template.yaml"
