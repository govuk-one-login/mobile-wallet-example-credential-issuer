name: _module-sonarqube

on:
  workflow_call:
    inputs:
      project-base-dir:
        description: Sonar project base dir, e.g. ./document-builder
        required: true
        type: string
      scan-metadata-report-file:
        description: Path to report-task.txt used by the quality gate.
        required: true
        type: string
      mode:
        description: "'node-scan-action' | 'gradle'"
        required: false
        type: string
        default: node-scan-action
      skip-for-dependabot:
        description: Skip scan + gate when actor is dependabot[bot].
        required: false
        type: boolean
        default: false
      quality-gate-timeout-minutes:
        description: Timeout for the quality-gate step.
        required: false
        type: number
        default: 5
      java-version:
        description: Java version (gradle mode).
        required: false
        type: string
        default: "17"
      fetch-depth:
        description: >-
          Checkout fetch depth for all modes. Defaults to 0 (full history),
          which Sonar's new-code / SCM analysis needs.
        required: false
        type: number
        default: 0
    secrets:
      SONAR_TOKEN:
        description: SonarQube token used by the scan and quality-gate steps.
        required: true

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ format('{0}', inputs.fetch-depth) }}

      # --- Node scan-action path ---
      - name: SonarQube Scan
        if: ${{ inputs.mode == 'node-scan-action' }}
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: ${{ inputs.project-base-dir }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Gradle path (for Java services) ---
      - name: Set up JDK
        if: ${{ inputs.mode == 'gradle' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'corretto'
          cache: gradle

      - name: Perform static analysis (gradle)
        if: ${{ inputs.mode == 'gradle' && (inputs.skip-for-dependabot == false || github.actor != 'dependabot[bot]') }}
        working-directory: ${{ inputs.project-base-dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

      # --- Shared quality gate ---
      - name: SonarQube Quality Gate check
        if: ${{ inputs.skip-for-dependabot == false || github.actor != 'dependabot[bot]' }}
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: ${{ inputs.quality-gate-timeout-minutes }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: ${{ inputs.scan-metadata-report-file }}
