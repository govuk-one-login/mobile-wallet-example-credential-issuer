name: Reusable - Node SonarQube Analysis

on:
  workflow_call:
    inputs:
      working-directory:
        description: Service directory containing package.json and sonar-project.properties.
        required: true
        type: string
      node-version-file:
        description: Path (relative to repo root) to the service .nvmrc file.
        required: true
        type: string
      coverage-script:
        description: npm script that produces coverage/lcov.info (e.g. test:cov, test:unit).
        required: true
        type: string
      sonar-report-path:
        description: Path (relative to repo root) to the Sonar scanner report-task.txt.
        required: false
        default: ''
        type: string
      npm-ci-args:
        description: Extra args passed to npm ci (e.g. --ignore-scripts).
        required: false
        default: '--ignore-scripts'
        type: string
      gitRef:
        description: Branch name or commit SHA to check out.
        required: false
        default: ''
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  run-code-quality-and-security-analysis:
    name: Run code quality and security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitRef }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci ${{ inputs.npm-ci-args }}

      - name: Generate coverage report
        run: npm run ${{ inputs.coverage-script }}

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: ${{ inputs.sonar-report-path != '' && inputs.sonar-report-path || format('{0}/.scannerwork/report-task.txt', inputs.working-directory) }}
