name: Reusable - SAM Deploy

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the SAM template.yaml.
        required: true
        type: string
      gitRef:
        description: Branch name or commit SHA to check out (empty uses the default ref).
        required: false
        default: ''
        type: string
      sam-version:
        description: SAM CLI version to install.
        required: false
        default: '1.160.0'
        type: string
      sam-validate-args:
        description: Extra args for `sam validate` (e.g. --lint).
        required: false
        default: ''
        type: string
      sam-build-args:
        description: Extra args for `sam build` (e.g. --parallel).
        required: false
        default: ''
        type: string
      template-file:
        description: Built template path passed to devplatform-upload-action.
        required: false
        default: '.aws-sam/build/template.yaml'
        type: string
      setup-node:
        description: Whether to set up Node.js before building (e.g. esbuild Lambdas).
        required: false
        default: false
        type: boolean
      node-version-file:
        description: Path (relative to repo root) to the .nvmrc, when setup-node is true.
        required: false
        default: ''
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      ARTIFACT_BUCKET_NAME:
        required: true
      SIGNING_PROFILE_NAME:
        required: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.gitRef }}

      - name: Set up Node.js
        if: ${{ inputs.setup-node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: ${{ inputs.sam-version }}
          use-installer: true

      - name: Validate SAM template
        run: |
          echo "SAM_CLI_TELEMETRY=0" >> $GITHUB_ENV
          sam validate ${{ inputs.sam-validate-args }}

      - name: Build SAM template
        run: sam build ${{ inputs.sam-build-args }}

      - name: Deploy SAM app
        # Upload the built SAM application artifacts to the deployment pipeline S3 bucket
        uses: govuk-one-login/devplatform-upload-action@6677f824e2e0899e207870cfc8224858d1dd6fac # v4.4.1
        with:
          artifact-bucket-name: ${{ secrets.ARTIFACT_BUCKET_NAME }}
          signing-profile-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          working-directory: ${{ inputs.working-directory }}
          template-file: ${{ inputs.template-file }}
