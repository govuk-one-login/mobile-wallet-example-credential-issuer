name: Test Harness - Nightly Quality Analysis & Docker Image Vulnerability Scan

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-sonarqube-scan:
    name: Run SonarQube Scan
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-node-sonar.yml
    with:
      working-directory: ./test-harness
      node-version-file: test-harness/.nvmrc
      coverage-script: test:unit
      sonar-report-path: test-harness/.scannerwork/report-task.txt
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
