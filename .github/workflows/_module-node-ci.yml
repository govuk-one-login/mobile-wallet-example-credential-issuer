name: _module-node-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Service directory, e.g. ./document-builder
        required: true
        type: string
      node-version-file:
        description: Path to the .nvmrc file (repo-root relative).
        required: true
        type: string
      install-command:
        description: Dependency install command.
        required: false
        type: string
        default: npm ci
      run-build:
        description: Run `npm run build`.
        required: false
        type: boolean
        default: false
      lint-command:
        description: Lint command (skipped when empty).
        required: false
        type: string
        default: ""
      format-check-command:
        description: Format-check command (skipped when empty).
        required: false
        type: string
        default: ""
      test-command:
        description: Test / coverage command.
        required: false
        type: string
        default: npm run test:cov
      fetch-depth:
        description: Checkout fetch depth.
        required: false
        type: number
        default: 0
      run-sam-validate:
        description: Run SAM validate after tests.
        required: false
        type: boolean
        default: false
      sam-version:
        description: SAM CLI version (when validating).
        required: false
        type: string
        default: 1.90.0
      sam-validate-working-directory:
        description: Directory to cd into before `sam validate` (relative to working-directory; empty = none).
        required: false
        type: string
        default: ""
      sam-validate-args:
        description: Arguments for `sam validate`.
        required: false
        type: string
        default: --region eu-west-2

jobs:
  node-ci:
    name: Run tests, lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Build source code
        if: ${{ inputs.run-build }}
        run: npm run build

      - name: Run the linter
        if: ${{ inputs.lint-command != '' }}
        run: ${{ inputs.lint-command }}

      - name: Check code formatting
        if: ${{ inputs.format-check-command != '' }}
        run: ${{ inputs.format-check-command }}

      - name: Generate coverage report
        run: ${{ inputs.test-command }}

      - name: Setup SAM CLI
        if: ${{ inputs.run-sam-validate }}
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # pin@v3
        with:
          version: ${{ inputs.sam-version }}
          use-installer: true

      - name: SAM Validate
        if: ${{ inputs.run-sam-validate }}
        env:
          SAM_VALIDATE_DIR: ${{ inputs.sam-validate-working-directory }}
          SAM_VALIDATE_ARGS: ${{ inputs.sam-validate-args }}
        run: |
          echo "SAM_CLI_TELEMETRY=0" >> $GITHUB_ENV
          if [ -n "$SAM_VALIDATE_DIR" ]; then cd "$SAM_VALIDATE_DIR"; fi
          sam validate $SAM_VALIDATE_ARGS
